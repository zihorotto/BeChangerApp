name: CI Pipeline

on:
  push:
    branches:
      - develop
    paths:
      - backend/**
      - frontend/**
      - docker/**
      - .github/workflows/*

jobs:
  # Backend build and tests
  backend-build:
    runs-on: self-hosted
    name: Build and Test Backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK for Backend
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'corretto'

      - name: Compile Backend project
        run: |
          cd backend
          mvn clean compile

      - name: Run unit tests for Backend
        run: |
          cd backend
          mvn clean test

      - name: Build Backend Docker Image
        run: |
          cd backend
          mvn clean package
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/bc-backend:${{ github.sha }} -f docker/backend/Dockerfile .

      - name: Push Backend Docker Image to DockerHub
        run: |
          docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/bc-backend:${{ github.sha }}

  # Frontend build
  frontend-build:
    runs-on: self-hosted
    name: Build Frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js for Frontend
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install Frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Build Frontend project
        run: |
          cd frontend
          npm run build

      - name: Build Frontend Docker Image
        run: |
          cd frontend
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/bc-frontend:${{ github.sha }} -f docker/frontend/Dockerfile .

      - name: Push Frontend Docker Image to DockerHub
        run: |
          docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/bc-frontend:${{ github.sha }}

  notify:
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    steps:
      - name: Send notification
        run: |
          echo "CI pipeline completed successfully!"
