name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed

jobs:

  build:

    runs-on: self-hosted

    steps:
      - name: Delete old backend docker containers
        run: sudo docker rm -f bc-api || true
      - name: Delete old keycloak docker containers
        run: sudo docker rm -f keycloak-bc || true
      - name: Delete old frontend docker container
        run: sudo docker rm -f bc-frontend || true
      - name: Delete all docker image
        run: sudo docker image prune -a -f

      - name: Pull backend docker image
        run: sudo docker pull zihorotto/bc-api:latest
      - name: Run backend docker container
        run: sudo docker run -d -p 8088:8088 --name bc-api zihorotto/bc-api

      - name: Pull postgres sql image
        run: sudo docker pull zihorotto/postgres-sql-bc:latest
      - name: Run backend docker container
        run: sudo docker run -d -p 5432:5432 --name bc-api zihorotto/postgres-sql-bc

      - name: Pull keycloak docker image
        run: sudo docker pull zihorotto/keycloak-bc:latest
      - name: Run backend docker container
        run: sudo docker run -d -p 9090:8080 --name keycloak-bc zihorotto/keycloak-bc

      - name: Pull frontend docker image
        run: sudo docker pull zihorotto/blog-project-frontend:latest
      - name: Run frontend docker container
        run: sudo docker run -d -p 4200:80 --name blog-project-frontend-container zihorotto/blog-project-frontend