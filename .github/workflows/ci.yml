name: CI Pipeline

on:
  push:
    branches: [ "develop-deploy" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      - name: Build the Backend Docker Image
        run: docker build -t zihorotto/bc-api backend/
      - name: Backend image push to Dockerhub
        run: docker push zihorotto/bc-api:latest

      - name: Build the postgres sql Image
        run: docker build -t zihorotto/postgres-sql-bc backend/
      - name: Backend image push to Dockerhub
        run: docker push zihorotto/postgres-sql-bc:latest

      - name: Build the keycloak Docker Image
        run: docker build -t zihorotto/keycloak-bc backend/
      - name: Backend image push to Dockerhub
        run: docker push zihorotto/keycloak-api:latest

      - name: Build the Frontend Docker Image
        run: docker build -t zihorotto/bc-frontend frontend/
      - name: Backend image push to Dockerhub
        run: docker push zihorotto/bc-frontend:latest