<div class="card flex justify-content-center">
    <!-- <p-button (onClick)="showDialog()" label="Show" /> -->
    <p-dialog header="Return and share feedback" [modal]="true" [(visible)]="visible" [style]="{ width: '30rem' }">
        <span class="p-text-secondary block mb-2">Name: {{item.name}}</span>
        <span class="p-text-secondary block mb-2">Brand: {{item.brand}}</span>
        <span class="p-text-secondary block mb-4">Identifier: {{item.identifier ? item.identifier : '-'}}</span>

        <div class="card flex justify-content-center mb-4">
            <p-rating [(ngModel)]="feedbackRequest.note" />
        </div>
        <div class="card flex justify-content-center mb-4">
            <textarea 
                rows="5"
                cols="40" 
                pInputTextarea 
                [(ngModel)]="feedbackRequest.comment">
            </textarea>
        </div>
        <div class="flex justify-content-end gap-2 mt-2">
            <p-button label="Cancel" severity="secondary" (onClick)="closeDialog()" />
            <p-button label="Save" (onClick)="returnProduct()" />
        </div>
    </p-dialog>
</div>
