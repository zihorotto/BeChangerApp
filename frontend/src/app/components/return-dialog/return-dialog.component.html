<div class="card flex justify-content-center">
    <!-- <p-button (onClick)="showDialog()" label="Show" /> -->
    <p-dialog header="Return and share feedback" [modal]="true" [(visible)]="visible" [style]="{ width: '30rem' }">
        <span class="p-text-secondary block mb-2">Title: {{item.title}}</span>
        <span class="p-text-secondary block mb-2">Publisher name: {{item.publisherName}}</span>
        <span class="p-text-secondary block mb-4">UPC: {{item.upc}}</span>

        <div class="card flex justify-content-center mb-4">
            <p-rating [(ngModel)]="rate" />
        </div>
        <div class="card flex justify-content-center mb-4">
            <textarea 
                rows="5"
                cols="40" 
                pInputTextarea 
                [(ngModel)]="value">
            </textarea>
        </div>
        <div class="flex justify-content-end gap-2 mt-2">
            <p-button label="Cancel" severity="secondary" (onClick)="visible = false" />
            <p-button label="Save" (onClick)="visible = false" />
        </div>
    </p-dialog>
</div>
