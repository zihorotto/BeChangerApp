<div class="lg:px-8 md:px-6 px-4 py-4 surface-ground ng-star-inserted">
    <p-button (onClick)="navigateToAddNewBook()" label="Add new game" icon="pi pi-plus" />
    <div class="flex flex-row flex-wrap gap-3 mt-4">
        @for (game of gameResponse.content; track game.upc) {
            <app-game-card 
                [game]="game"
                [manage]="true"
                (archive)="archiveGame($event)"
                (share)="shareGame($event)"
                (edit)="editGame($event)"
            ></app-game-card>
        }
    </div>
    <div class="card flex justify-content-center pt-8">
        <p-paginator 
            (onPageChange)="onPageChange($event)" 
            [first]="page" 
            [rows]="size" 
            [totalRecords]="120" 
            [rowsPerPageOptions]="[10, 20, 30]" />
    </div>
</div>
