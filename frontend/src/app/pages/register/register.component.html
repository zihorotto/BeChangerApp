<div class="align-items-center flex justify-content-center lg:px-8 md:px-6 px-4 py-8 surface-ground ng-star-inserted">
    <div class="surface-card p-4 shadow-2 border-round w-full lg:w-6">
        <div class="text-center mb-5">
            <div class="text-900 text-3xl font-medium mb-3">Create an account</div>
            <span class="text-600 font-medium line-height-3">You already have an account?</span>
            <a href="/login" class="font-medium no-underline ml-2 text-blue-500 cursor-pointer">Log in!</a>
        </div>
        <div class="card">
            <p-messages [hideTransitionOptions]="'500ms'" [showTransitionOptions]="'500ms'"  />
        </div>
        <div>
            <label for="firstname" class="block text-900 font-medium mb-2">First name</label>
            <input 
                [(ngModel)]="registerRequest.firstname"
                id="firstname" type="text"
                placeholder="First name"
                pInputText
                class="w-full mb-3">

            <label for="lastname" class="block text-900 font-medium mb-2">Last name</label>
            <input 
                [(ngModel)]="registerRequest.lastname"
                id="lastname" type="text"
                placeholder="Last name"
                pInputText
                class="w-full mb-3">

            <label for="email" class="block text-900 font-medium mb-2">Email</label>
            <input 
                [(ngModel)]="registerRequest.email"
                id="email" type="text"
                placeholder="Email"
                pInputText
                class="w-full mb-3">

            <label for="password" class="block text-900 font-medium mb-2">Password</label>
            <input 
                [(ngModel)]="registerRequest.password"
                id="password"
                type="password"
                placeholder="Password"
                pInputText
                class="w-full mb-3">
            <div class="text-center">
                <button (click)="register()" pButton pRipple label="Register" icon="pi pi-user" class=".lg\:w-6 "></button>
            </div>
        </div>
    </div>
</div>
