<div class="align-items-center flex justify-content-center lg:px-8 md:px-6 px-4 py-8 surface-ground ng-star-inserted h-full">
    <div class="surface-card p-4 shadow-2 border-round w-full lg:w-6">
        <div class="text-center mb-5">
            <div class="text-900 text-3xl font-medium mb-3">Welcome Back</div>
            <span class="text-600 font-medium line-height-3">Don't have an account?</span>
            <a href="/register" class="font-medium no-underline ml-2 text-blue-500 cursor-pointer">Create today!</a>
        </div>
        <div class="card">
            <p-messages [hideTransitionOptions]="'500ms'" [showTransitionOptions]="'500ms'"  />
        </div>
        <div>
            <label for="email" class="block text-900 font-medium mb-2">Email</label>
            <input 
                [(ngModel)]="authRequest.email"
                id="email" type="text"
                placeholder="Email"
                pInputText
                class="w-full mb-3">

            <label for="password" class="block text-900 font-medium mb-2">Password</label>
            <input 
                [(ngModel)]="authRequest.password"
                id="password"
                type="password"
                placeholder="Password"
                pInputText
                class="w-full mb-3">
            <div class="text-center">
                <button (click)="login()" pButton pRipple label="Sign In" icon="pi pi-user" class=".lg\:w-6 "></button>
            </div>
        </div>
    </div>
</div>
