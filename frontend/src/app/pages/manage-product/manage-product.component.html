<p-toast />
<div
  class="border border-surface rounded-3xl p-10 flex flex-col gap-4 my-10 mx-32"
>
  <div class="text-2xl text-color font-medium">Add new product</div>
  <p-divider />
  <div class="flex flex-row gap-2">
    <div class="basis-2/3">
      <div class="flex flex-col gap-2">
        <label for="email" class="text-color font-medium leading-6">Name</label>
        <input
          [(ngModel)]="productRequest.name"
          id="email"
          type="text"
          pInputText
        />
      </div>

      <div class="flex flex-col gap-2 mt-6">
        <label for="brand" class="text-color font-medium leading-6"
          >Brand</label
        >
        <input
          [(ngModel)]="productRequest.brand"
          id="brand"
          type="text"
          pInputText
          class="p-inputtext p-component p-element"
        />
      </div>

      <div class="flex flex-col gap-2 mt-6">
        <label for="description" class="text-color font-medium leading-6"
          >Description</label
        >
        <textarea
          id="description"
          [(ngModel)]="productRequest.description"
          type="text"
          pInputText
          rows="5"
          class="p-inputtextarea p-inputtext p-component p-element p-inputtextarea-resizable"
          style="height: 132px; overflow: hidden"
        >
        </textarea>
      </div>
      <div class="flex flex-col gap-2 mt-6">
        <label for="identifier" class="text-color font-medium leading-6"
          >Identifier</label
        >
        <input
          [(ngModel)]="productRequest.identifier"
          id="identifier"
          type="text"
          pInputText
          class="p-inputtext p-component p-element"
        />
      </div>
    </div>
    <div class="basis-1/3 justify-between flex flex-col gap-2">
      <div>
        <span class="font-medium text-900 mb-2">Cover Picture</span>
        <img
          [src]="
            selectedPicture ||
            'https://primefaces.org/cdn/primeng/images/card-ng.jpg'
          "
          class="w-full max-h-20 mt-2"
        />
        <input
          (change)="onUpload($event)"
          class="form-control"
          type="file"
          id="formFile"
          accept="image/*"
          class="mt-4"
        />
      </div>
      <div class="flex flex-row mt-4 gap-3 justify-center">
        <p-toggleswitch
          [(ngModel)]="productRequest.available"
          inputid="privacy2"
          class="p-element"
        >
          <div class="p-inputswitch p-component">
            <div class="p-hidden-accessible">
              <input
                type="checkbox"
                role="switch"
                id="privacy2"
                aria-checked="false"
              />
            </div>
            <span class="p-inputswitch-slider"></span>
          </div>
        </p-toggleswitch>
        <span class="text-color font-medium leading-6">Share me!</span>
      </div>
    </div>
  </div>
  <div class="flex justify-end">
    <p-button
      (click)="save()"
      label="Save product"
      [rounded]="true"
      severity="success"
    />
  </div>

</div>
